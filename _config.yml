title: Sojo's BLOG
author: ActedKitten
url: https://actedkitten.github.io/blog
baseurl: /blog

# Theme
theme: jekyll-theme-minimal

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Collections
collections:
  posts:
    output: true
    permalink: /posts/:title/

# Pagination
paginate: 10
paginate_path: /page:num/

# Show downloads
show_downloads: false
